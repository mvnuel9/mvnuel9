<svg width="100%" viewBox="0 0 800 234" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B0D0F"/>
      <stop offset="55%"  stop-color="#12151A"/>
      <stop offset="100%" stop-color="#1A1D23"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#B8FF5A"/>
      <stop offset="100%" stop-color="#5AFFC0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#B8FF5A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#B8FF5A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="corners">
      <rect width="800" height="234" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#corners)">
    <!-- Background -->
    <rect width="800" height="234" fill="url(#bgGrad)"/>
    <rect width="800" height="234" fill="url(#grid)"/>
    <ellipse cx="400" cy="124" rx="340" ry="130" fill="url(#glow)"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="800" height="38" fill="#14171C"/>
    <rect x="0" y="37" width="800" height="1" fill="rgba(255,255,255,0.06)"/>
    <circle cx="24" cy="19" r="6" fill="#FF5F56" opacity="0.85"/>
    <circle cx="44" cy="19" r="6" fill="#FFBD2E" opacity="0.85"/>
    <circle cx="64" cy="19" r="6" fill="#27C93F" opacity="0.85"/>
    <text x="400" y="24" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="middle">~/mvnuel9 git:(main)</text>

    <!-- Decorative code snippet (behind hero text) -->
    <g font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13" fill="rgba(184,255,90,0.09)">
      <text x="480" y="76">const dev = {</text>
      <text x="480" y="96">  focus: 'product',</text>
      <text x="480" y="116">  ships: true,</text>
      <text x="480" y="136">  stack: [...],</text>
      <text x="480" y="156">  status: 'shipping'</text>
      <text x="480" y="176">};</text>
    </g>

    <!-- Kicker -->
    <text
      x="56" y="64"
      font-family="'Fira Code', 'Cascadia Code', Consolas, monospace"
      font-size="16"
      fill="#B8FF5A"
      letter-spacing="0.5"
    >&gt; Salut, je suis<tspan fill="#B8FF5A"> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>

    <!-- Monogram -->
    <g transform="translate(35,62.9) scale(1.3)">
      <path
        d="M16 44 V20 H21 L32 34 L43 20 H48 V44 H42 V29 L34.5 39 H29.5 L22 29 V44 H16 Z"
        fill="#F1F3F5"
      />
      <path
        d="M35.5 20 H41 L31.5 44 H26 L35.5 20 Z"
        fill="#B8FF5A"
      />
    </g>

    <!-- Name -->
    <text
      x="112" y="118"
      font-family="'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="38"
      font-weight="700"
      fill="white"
    >Luck-Emmanuel Koffi</text>

    <!-- Role -->
    <text
      x="56" y="168"
      font-family="'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="42"
      font-weight="700"
      fill="url(#textGrad)"
    >Développeur FullStack</text>

    <!-- Tag -->
    <text
      x="56" y="196"
      font-family="'Fira Code', 'Cascadia Code', Consolas, monospace"
      font-size="12"
      font-weight="500"
      fill="rgba(255,255,255,0.45)"
      letter-spacing="3"
    >PRODUCT BUILDER · IDÉE → PROD</text>

    <!-- Status bar -->
    <rect x="0" y="210" width="800" height="24" fill="#14171C"/>
    <rect x="0" y="210" width="800" height="1" fill="rgba(255,255,255,0.06)"/>
    <circle cx="20" cy="222" r="3" fill="#B8FF5A"/>
    <text x="32" y="226" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="11" fill="rgba(255,255,255,0.4)">mvnuel.com</text>
    <text x="780" y="226" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="end">UTF-8 · Fira Code</text>
  </g>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="799" height="233" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>
